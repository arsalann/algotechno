<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>algotechno // acid rig</title>
  <script src="https://unpkg.com/@strudel/repl@latest"></script>
  <style>
    body { margin: 0; background: #0b0b0b; color: #d6ff3a; font: 13px ui-monospace, monospace; }
    header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #222; height: 28px; }
    header b { letter-spacing: 2px; }
    select, button, label { white-space: nowrap;
      background: #161616; color: #d6ff3a; border: 1px solid #333; padding: 4px 8px; font: inherit; }
    button:hover { background: #d6ff3a; color: #000; cursor: pointer; }
    .hw-link { color: #ff8a2a; border: 1px solid #ff8a2a; padding: 4px 8px; text-decoration: none; white-space: nowrap; }
    .hw-link:hover { background: #ff8a2a; color: #000; }
    #status { margin-left: auto; opacity: .6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    main { display: flex; height: calc(100vh - 45px); }
    aside { width: 230px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid #222; padding: 8px; box-sizing: border-box; }
    aside h4 { margin: 12px 0 6px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; opacity: .55; }
    aside .hint { font-size: 11px; opacity: .5; line-height: 1.4; margin: 0 0 4px; }
    .block { display: block; width: 100%; text-align: left; margin: 0 0 4px; cursor: grab; border-left: 3px solid #d6ff3a; }
    .block.modifier { border-left-color: #56B4E9; color: #56B4E9; }
    .block.line { border-left-color: #CC79A7; color: #CC79A7; border-left-style: double; border-left-width: 4px; }
    .block.modifier:hover { background: #56B4E9; }
    .block.line:hover { background: #CC79A7; }
    #tip { font-size: 11px; opacity: .7; min-height: 30px; margin-top: 10px; line-height: 1.4; }
    #editor-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
    #file-state { opacity: .6; }
    #file-state.dirty { color: #E69F00; opacity: 1; }
    /* the component renders its editor into a sibling div, not inside itself */
    strudel-editor { display: none; }
    strudel-editor + div { flex: 1; min-height: 0; overflow: auto; font-size: 16px; }
    strudel-editor + div .cm-scroller { position: relative; }
    /* problems panel + red line marker */
    #problems { border-top: 1px solid #222; padding: 6px 12px; min-height: 20px; max-height: 30%; overflow-y: auto; font-size: 13px; }
    #problems.ok { color: #6f8a1f; }
    #problems .p { cursor: pointer; padding: 3px 0; line-height: 1.4; }
    #problems .p:hover { text-decoration: underline; }
    #problems .error { color: #ff7a4a; font-weight: bold; }
    #problems .warn { color: #F0E442; }
    #problems .fix { color: #aaa; }
    .err-mark { position: absolute; left: 0; right: 0; pointer-events: none; background: rgba(213, 94, 0, .22); border-left: 5px solid #D55E00; z-index: 1; }
    .err-mark.warn { background: rgba(240, 228, 66, .08); border-left: 5px dashed #F0E442; }
    @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    #problems.shake { animation: shake .2s 2; }
    strudel-editor + div .cm-scroller { font-family: ui-monospace, Menlo, monospace !important; }
  </style>
</head>
<body>
  <header>
    <b>ACID//RIG</b>
    <select id="picker"></select>
    <button id="play" title="play / update (⌘Enter)">▶ play</button>
    <button id="stop" title="stop (⌘.)">■ stop</button>
    <button id="mutate" title="make one small random change (⌘Z to undo)">🎲 mutate</button>
    <button id="notes" title="visual note & chord editor for the line your cursor is on (⌘B)">🎹 notes</button>
    <button id="save" title="save to the current file (⌘S)">💾 save</button>
    <button id="saveas" title="save as a new file in patterns/ (⇧⌘S)">save as…</button>
    <span id="file-state"></span>
    <label title="when a pattern file is saved in another editor, load and play it here"><input type="checkbox" id="follow" checked /> hot-swap</label>
    <a href="/hardware.html" class="hw-link" id="to-hw" title="open this code in hardware mode: virtual 303, 909, synths & modulators">🎛 hardware</a>
    <span id="status">click play once to unlock audio</span>
  </header>
  <main>
    <aside id="palette">
      <p class="hint">Click to add, or drag into the code.<br>
        <span style="color:#d6ff3a">■ sounds</span> join the stack ·
        <span style="color:#56B4E9">■ effects</span> attach to the line your cursor is on</p>
      <div id="blocks"></div>
      <div id="tip"></div>
    </aside>
    <div id="editor-wrap">
      <strudel-editor id="repl"><!--
// loading...
--></strudel-editor>
      <div id="problems" class="ok">✓ no problems</div>
    </div>
  </main>

  <script type="module">
    import { BLOCKS } from '/blocks.js';
    import * as acorn from 'https://esm.sh/acorn@8';
    import { createNoteEditor } from '/noteeditor.js';

    const repl = document.getElementById('repl');
    const picker = document.getElementById('picker');
    const status = document.getElementById('status');
    const tip = document.getElementById('tip');
    const ed = () => repl.editor;
    const view = () => repl.editor.editor; // the underlying CodeMirror view
    let playing = false;

    const say = (msg) => (status.textContent = msg);
    const play = () => {
      // don't send broken code to Strudel — the old version keeps playing instead
      if (validate().some((p) => p.level === 'error')) {
        problemsEl.classList.remove('shake'); void problemsEl.offsetWidth; problemsEl.classList.add('shake');
        return say('fix the red error first — the previous version keeps playing');
      }
      runtimeProblem = null;
      ed().evaluate(); playing = true; say('playing ' + new Date().toLocaleTimeString());
    };
    const stop = () => { ed().stop(); playing = false; say('stopped'); };
    // re-evaluate after an edit, but only if the music is already running
    const refresh = () => { if (playing) play(); };

    // ---------- files: load / save / unsaved-changes tracking ----------
    let currentFile = null, savedCode = null;
    const fileState = document.getElementById('file-state');
    const isDirty = () => savedCode !== null && view().state.doc.toString() !== savedCode;
    function updateFileState() {
      fileState.className = isDirty() ? 'dirty' : '';
      fileState.textContent = isDirty() ? '● unsaved' : currentFile ? 'saved' : '';
    }
    setInterval(updateFileState, 500);
    window.addEventListener('beforeunload', (e) => { if (isDirty()) e.preventDefault(); });

    async function save(file, overwrite) {
      const code = view().state.doc.toString();
      const res = await fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file, code, overwrite }) });
      const out = await res.json();
      if (res.status === 409) {
        if (confirm(`${out.file} already exists. Replace it?`)) return save(file, true);
        return;
      }
      if (!res.ok) return say('✖ ' + out.error);
      if (![...picker.options].some((o) => o.value === out.file)) {
        picker.add(new Option(out.file));
        [...picker.options].sort((a, b) => a.value.localeCompare(b.value)).forEach((o) => picker.add(o));
      }
      currentFile = out.file; savedCode = code; picker.value = out.file;
      updateFileState();
      say('💾 saved patterns/' + out.file);
    }
    function saveAs() {
      const name = prompt('Save as (goes in patterns/):', currentFile ? currentFile.replace(/\.js$/, '') + '-2' : 'my-track');
      if (name) save(name, false);
    }
    document.getElementById('save').onclick = () => (currentFile ? save(currentFile, true) : saveAs());
    document.getElementById('saveas').onclick = saveAs;

    async function load(file, autoplay = false) {
      if (isDirty() && !confirm('You have unsaved changes. Load ' + file + ' anyway?')) { picker.value = currentFile; return; }
      const code = await (await fetch('/patterns/' + file)).text();
      picker.value = file;
      ed().setCode(code);
      currentFile = file; savedCode = code;
      notes.close();
      say('loaded ' + file);
      if (autoplay) play();
    }

    // ---------- editing helpers ----------
    function replaceRange(from, to, insert, select = true) {
      view().dispatch({ changes: { from, to, insert }, ...(select && { selection: { anchor: from + insert.length } }) });
      view().focus();
    }

    function addLayer(code) {
      const doc = view().state.doc.toString();
      // put the new layer just before the closing ")" of the last stack(...)
      const close = doc.search(/^\)\s*$(?![\s\S]*^\))/m);
      if (close === -1) return replaceRange(view().state.selection.main.head, view().state.selection.main.head, '\n' + code + '\n');
      replaceRange(close, close, '  ' + code + '\n');
    }

    function addModifier(code) {
      const { state } = view();
      const line = state.doc.lineAt(state.selection.main.head);
      const text = line.text;
      if (!text.trim() || text.trim().startsWith('//') || /^\s*(stack\(|\))\s*$/.test(text)) {
        say('put your cursor on a sound line first');
        return;
      }
      // insert before a trailing comma / comment so the code stays valid
      const m = text.match(/^(.*?)(\s*,?\s*(\/\/.*)?)$/);
      const at = line.from + m[1].length;
      replaceRange(at, at, code);
    }

    function addLine(block) {
      const doc = view().state.doc.toString();
      if (block.name === 'empty track') return replaceRange(0, doc.length, block.code);
      const existing = doc.match(/^setcps\(.*\).*$/m);
      if (existing) return replaceRange(existing.index, existing.index + existing[0].length, block.code);
      replaceRange(0, 0, block.code + '\n');
    }

    // ---------- palette ----------
    const blocksEl = document.getElementById('blocks');
    for (const group of BLOCKS) {
      const h = document.createElement('h4');
      h.textContent = group.group;
      blocksEl.append(h);
      for (const block of group.items) {
        const b = document.createElement('button');
        b.className = 'block ' + block.kind;
        b.textContent = block.name;
        b.draggable = true;
        b.onmouseenter = () => (tip.textContent = block.tip);
        b.onmouseleave = () => (tip.textContent = '');
        b.onclick = () => {
          if (block.kind === 'layer') addLayer(block.code);
          else if (block.kind === 'modifier') addModifier(block.code);
          else addLine(block);
          refresh();
        };
        b.ondragstart = (e) => {
          const text = block.kind === 'layer' ? '  ' + block.code + '\n' : block.code;
          e.dataTransfer.setData('text/plain', text);
        };
        blocksEl.append(b);
      }
    }

    // ---------- 🎲 mutate: one small random, musical change ----------
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const MUTATIONS = [
      { re: /\.ribbon\((\d+)/g, label: 'new random phrase', fn: () => String(Math.floor(Math.random() * 100)) },
      { re: /\.slow\((\d+)\)/g, label: 'sweep speed', fn: () => pick(['2', '4', '8', '12', '16']) },
      { re: /\.segment\((\d+)\)/g, label: 'note density', fn: () => pick(['8', '12', '16']) },
      { re: /\.lpq\((\d+)\)/g, label: 'squelch', fn: () => String(10 + Math.floor(Math.random() * 16)) },
      { re: /\.degradeBy\(([\d.]+)\)/g, label: 'rests', fn: () => pick(['.1', '.2', '.3', '.4']) },
      { re: /\.every\((\d+)/g, label: 'fill spacing', fn: () => pick(['2', '4', '8']) },
      { re: /scale\("[A-G]\d:([a-z:]+)"\)/g, label: 'scale', fn: () => pick(['minor', 'minor:pentatonic', 'phrygian', 'dorian']) },
      // nudge a slider somewhere inside its range
      { re: /slider\(([\d.]+),\s*([\d.]+),\s*([\d.]+)\)/g, label: 'knob', fn: (m) => {
          const [min, max] = [parseFloat(m[2]), parseFloat(m[3])];
          const v = min + Math.random() * (max - min);
          return max > 10 ? String(Math.round(v)) : v.toFixed(2);
        } },
    ];
    document.getElementById('mutate').onclick = () => {
      const doc = view().state.doc.toString();
      const options = MUTATIONS.flatMap((mu) => [...doc.matchAll(mu.re)].map((m) => ({ mu, m })));
      if (!options.length) return say('nothing to mutate — add a generative 303 or some sliders');
      const { mu, m } = pick(options);
      const from = m.index + m[0].indexOf(m[1]);
      let value = mu.fn(m);
      for (let tries = 0; value === m[1] && tries < 10; tries++) value = mu.fn(m);
      replaceRange(from, from + m[1].length, value, false);
      refresh();
      say(`🎲 ${mu.label}: ${m[1]} → ${value}  (⌘Z to undo)`);
    };

    // ---------- validation & error highlighting ----------
    const problemsEl = document.getElementById('problems');
    let runtimeProblem = null; // error reported by Strudel while evaluating / playing
    let markers = [];

    // every function name Strudel knows, for "did you mean ...?"
    let known = null;
    function knownNames() {
      if (known) return known;
      const names = new Set(Object.keys(globalThis).filter((k) => typeof globalThis[k] === 'function'));
      // functions Strudel only injects while evaluating your code
      ['setcps', 'setcpm', 'setCps', 'setCpm', 'samples', 'hush', 'slider', 'sliderWithID', 'all', 'each', 'initHydra', 'H']
        .forEach((n) => names.add(n));
      try {
        let proto = Object.getPrototypeOf(globalThis.s('bd'));
        while (proto && proto !== Object.prototype) {
          Object.getOwnPropertyNames(proto).forEach((n) => names.add(n));
          proto = Object.getPrototypeOf(proto);
        }
      } catch {}
      if (names.has('lpf')) known = names; // only cache once Strudel has loaded
      return names;
    }
    function distance(a, b) {
      const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
      for (let j = 1; j <= b.length; j++) d[0][j] = j;
      for (let i = 1; i <= a.length; i++)
        for (let j = 1; j <= b.length; j++)
          d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      return d[a.length][b.length];
    }
    function didYouMean(name) {
      // allow ~1 typo per 3 letters, so short names don't get silly suggestions
      let best = null, bestD = Math.min(2, Math.max(1, Math.floor(name.length / 3))) + 1;
      for (const k of knownNames()) {
        if (k.startsWith('_') || Math.abs(k.length - name.length) > 2) continue;
        const dd = distance(name.toLowerCase(), k.toLowerCase());
        if (dd < bestD) { best = k; bestD = dd; }
      }
      return best;
    }

    // turn JS parser messages into something a musician can act on
    function explainSyntax(msg, code, pos) {
      const before = code.slice(0, pos).replace(/\s+$/, '');
      if (/Unexpected token/.test(msg) && /[)"\]]$/.test(before) && /^\s*[a-z]/i.test(code.slice(pos)))
        return 'missing comma — each layer inside stack( ) needs a "," at the end of its line';
      if (/Unexpected token/.test(msg) && before.endsWith(','))
        return 'there is a stray comma, or something is missing after it';
      if (/Unterminated string/.test(msg)) return 'a "quote" was opened but never closed';
      if (/Unexpected token|Unexpected character/.test(msg)) return 'unexpected character — check for a missing ")" , "," or "." nearby';
      if (/Unexpected end of input|Unexpected token \(\d/.test(msg) || pos >= code.length - 1)
        return 'the code ends too early — a "(" or "[" is probably never closed';
      return msg.replace(/\s*\(\d+:\d+\)$/, '');
    }

    // check (), [], {} pairs and mini-notation brackets inside "strings"
    function checkBrackets(code, problems) {
      const pairs = { ')': '(', ']': '[', '}': '{', '>': '<' };
      const tokens = [];
      try { for (const t of acorn.tokenizer(code, { ecmaVersion: 'latest' })) tokens.push(t); } catch { return; }
      for (const t of tokens) {
        if (t.type.label !== 'string' && t.type.label !== 'template') continue;
        const str = String(t.value ?? '');
        const stack = [];
        for (let i = 0; i < str.length; i++) {
          const c = str[i];
          if ('([{<'.includes(c)) stack.push({ c, i });
          else if (pairs[c]) {
            if (stack.length && stack[stack.length - 1].c === pairs[c]) stack.pop();
            else { problems.push({ level: 'error', pos: t.start + 1 + i, msg: `"${c}" in the pattern string has no matching "${pairs[c]}"` }); return; }
          }
        }
        if (stack.length) {
          const open = stack.pop();
          const close = { '(': ')', '[': ']', '{': '}', '<': '>' }[open.c];
          problems.push({ level: 'error', pos: t.start + 1 + open.i, msg: `"${open.c}" in the pattern string is never closed with "${close}"` });
        }
      }
    }

    // find a ( [ { in the code (outside strings) that is never closed / closed wrongly
    function unclosed(code) {
      const close = { ')': '(', ']': '[', '}': '{' }, open = { '(': ')', '[': ']', '{': '}' };
      const stack = [];
      try {
        for (const t of acorn.tokenizer(code, { ecmaVersion: 'latest' })) {
          const v = t.type.label;
          if (v === '${') stack.push({ c: '{', pos: t.start });
          else if (open[v]) stack.push({ c: v, pos: t.start });
          else if (close[v]) {
            const top = stack.pop();
            if (!top) return { level: 'error', pos: t.start, msg: `extra "${v}" — there's no "${close[v]}" for it to close` };
            if (top.c !== close[v]) return { level: 'error', pos: top.pos, msg: `"${top.c}" is closed with "${v}" — expected "${open[top.c]}"` };
          }
        }
      } catch { return null; }
      const top = stack.pop();
      return top ? { level: 'error', pos: top.pos, msg: `this "${top.c}" is never closed — add a "${open[top.c]}"` } : null;
    }

    // unknown function names, e.g. .lpff(...)  → "did you mean lpf?"
    function checkNames(ast, problems) {
      if (!knownNames().has('lpf')) return; // Strudel not loaded yet
      const declared = new Set();
      (function walk(n) {
        if (!n || typeof n.type !== 'string') return;
        if (n.type === 'VariableDeclarator' && n.id.type === 'Identifier') declared.add(n.id.name);
        if (/Function/.test(n.type)) n.params?.forEach((p) => p.type === 'Identifier' && declared.add(p.name));
        for (const k in n) { const v = n[k]; Array.isArray(v) ? v.forEach(walk) : v && typeof v === 'object' && walk(v); }
      })(ast);
      const names = knownNames();
      (function walk(n) {
        if (!n || typeof n.type !== 'string') return;
        if (n.type === 'CallExpression') {
          const c = n.callee;
          const id = c.type === 'Identifier' ? c : c.type === 'MemberExpression' && !c.computed ? c.property : null;
          if (id && !names.has(id.name) && !declared.has(id.name)) {
            const s = didYouMean(id.name);
            problems.push({ level: 'warn', pos: id.start, msg: `"${id.name}" isn't a Strudel function`, fix: s && `did you mean "${s}"?`, replace: s && { from: id.start, to: id.end, with: s } });
          }
        }
        for (const k in n) { const v = n[k]; Array.isArray(v) ? v.forEach(walk) : v && typeof v === 'object' && walk(v); }
      })(ast);
    }

    function validate() {
      const code = view().state.doc.toString();
      const problems = [];
      try {
        const ast = acorn.parse(code, { ecmaVersion: 'latest', sourceType: 'script', allowReturnOutsideFunction: true });
        checkBrackets(code, problems);
        checkNames(ast, problems);
      } catch (e) {
        if (!(e instanceof SyntaxError)) throw e;
        problems.push(unclosed(code) || { level: 'error', pos: e.pos, msg: explainSyntax(e.message, code, e.pos) });
      }
      if (runtimeProblem) problems.push(runtimeProblem);
      render(problems);
      return problems;
    }

    function explainRuntime(err, code) {
      const msg = String(err?.message ?? err);
      const m = msg.match(/(\w+) is not (?:a function|defined)/);
      if (m) {
        const s = didYouMean(m[1]);
        const pos = code.search(new RegExp('\\b' + m[1] + '\\b'));
        return { level: 'error', pos: pos < 0 ? undefined : pos, msg: `on play: "${m[1]}" doesn't exist in Strudel`, fix: s && `did you mean "${s}"?` };
      }
      return { level: 'error', msg: 'on play: ' + msg };
    }

    function render(problems) {
      const doc = view().state.doc;
      problemsEl.className = problems.length ? '' : 'ok';
      problemsEl.innerHTML = problems.length ? '' : '✓ no problems';
      markers.forEach((m) => m.remove());
      markers = [];
      for (const p of problems) {
        const line = p.pos != null ? doc.lineAt(Math.min(p.pos, doc.length)) : null;
        const row = document.createElement('div');
        row.className = 'p ' + p.level;
        row.textContent = (p.level === 'error' ? '✖ ' : '⚠ ') + (line ? `line ${line.number}: ` : '') + p.msg;
        if (p.fix) {
          const f = document.createElement('span');
          f.className = 'fix';
          f.textContent = '  → ' + p.fix + (p.replace ? ' (click to fix)' : '');
          row.append(f);
        }
        row.onclick = () => {
          if (p.replace) { replaceRange(p.replace.from, p.replace.to, p.replace.with); return validate(); }
          if (line) { view().dispatch({ selection: { anchor: line.from, head: line.to }, scrollIntoView: true }); view().focus(); }
        };
        problemsEl.append(row);
        if (line) {
          const block = view().lineBlockAt(line.from);
          const mark = document.createElement('div');
          mark.className = 'err-mark ' + p.level;
          mark.style.top = view().contentDOM.offsetTop + block.top + 'px';
          mark.style.height = block.height + 'px';
          view().scrollDOM.append(mark);
          markers.push(mark);
        }
      }
    }

    // re-check shortly after you stop typing
    function watchForEdits() {
      let last = null, timer;
      setInterval(() => {
        const code = view().state.doc.toString();
        if (code === last) return;
        if (last !== null) runtimeProblem = null; // it was about the old code
        last = code;
        clearTimeout(timer);
        timer = setTimeout(validate, 250);
      }, 150);
      // errors Strudel finds while evaluating or playing
      repl.addEventListener('update', (e) => {
        const err = e.detail?.evalError || e.detail?.schedulerError;
        const next = err ? explainRuntime(err, view().state.doc.toString()) : null;
        if (JSON.stringify(next) === JSON.stringify(runtimeProblem)) return;
        runtimeProblem = next;
        validate();
      });
    }

    // ---------- boot ----------
    (async () => {
      const files = await (await fetch('/patterns')).json();
      picker.innerHTML = files.map((f) => `<option>${f}</option>`).join('');
      // wait for the web component to boot its editor
      while (!ed()) await new Promise((r) => setTimeout(r, 50));
      // autocomplete + hover docs while typing
      ed().updateSettings({ isAutoCompletionEnabled: true, isTooltipEnabled: true });
      watchForEdits();
      // coming from hardware mode's "</> to code" button
      const imported = new URLSearchParams(location.search).has('import') && localStorage.getItem('algotechno:import');
      if (imported) {
        history.replaceState(null, '', '/');
        ed().setCode(imported);
        currentFile = null; savedCode = '';
        say('imported from hardware mode — 💾 save as… to keep it');
      } else if (files.length) load(files[0]);
    })();

    picker.onchange = () => load(picker.value, playing);

    // 🎛 hardware: take the current code along (hardware mode reads it into the machines)
    document.getElementById('to-hw').onclick = (e) => {
      e.preventDefault();
      if (validate().some((p) => p.level === 'error')) return say('fix the red error first — hardware mode needs code that runs');
      if (playing) stop();
      localStorage.setItem('algotechno:tohw', JSON.stringify({ code: view().state.doc.toString(), file: currentFile }));
      location.href = '/hardware.html?from=editor';
    };

    // ---------- 🎹 note editor ----------
    let refreshTimer;
    const notesChanged = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 150); };
    notesChanged.addLayer = addLayer;
    const notes = createNoteEditor({
      container: document.getElementById('editor-wrap'),
      view,
      onChange: notesChanged,
      // short audition of the clicked note(s)
      preview: (midis) => {
        try {
          const t = getAudioContext().currentTime + 0.02;
          for (const m of midis) superdough({ note: m, s: 'sawtooth', lpf: 1500, decay: .2, sustain: 0, gain: .35 }, t, .25);
        } catch {}
      },
    });
    document.getElementById('notes').onclick = () => (notes.isOpen() ? notes.close() : notes.open());
    document.getElementById('play').onclick = play;
    document.getElementById('stop').onclick = stop;

    // our own shortcuts (capture phase, so the editor can't swallow them as a line break)
    window.addEventListener('keydown', (e) => {
      const mod = e.ctrlKey || e.metaKey || e.altKey;
      if (mod && e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); play(); }
      else if (mod && e.key === '.') { e.preventDefault(); e.stopPropagation(); stop(); }
      else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
        e.preventDefault(); e.stopPropagation();
        e.shiftKey || !currentFile ? saveAs() : save(currentFile, true);
      }
      else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); e.stopPropagation(); document.getElementById('notes').click(); }
      else if (e.key === 'Escape' && notes.isOpen()) notes.close();
    }, true);

    new EventSource('/events').onmessage = (e) => {
      if (!document.getElementById('follow').checked) return;
      const { file, code } = JSON.parse(e.data);
      if (code === view().state.doc.toString()) return;
      if (isDirty() && file === currentFile && !confirm(file + ' changed on disk. Replace your unsaved browser edits?')) return;
      currentFile = file; savedCode = code;
      if (![...picker.options].some((o) => o.value === file)) picker.add(new Option(file));
      picker.value = file;
      ed().setCode(code);
      play();
      say('hot-swapped ' + file + ' @ ' + new Date().toLocaleTimeString());
    };
  </script>
</body>
</html>
